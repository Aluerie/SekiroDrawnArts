# Every push and pull request: check formatting and lints, run the tests, and build the
# ready-to-go folder (downloadable from the run's "Artifacts").
# Pushing a tag like v0.1.0: the same, then a GitHub Release with the zip attached.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Check the tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} doesn't match Cargo.toml version $version"
          }

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Upload the folder
        uses: actions/upload-artifact@v4
        with:
          name: SekiroDrawnArts
          path: dist/SekiroDrawnArts/

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zip

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" *.zip --title "${{ github.ref_name }}" --generate-notes
