# Drawn Arts settings. Put this file next to drawn_arts.dll.
#
# Keys: shift, lshift, rshift, ctrl, lctrl, rctrl, alt, lalt, ralt, tab, capslock, space,
#       mouse4, mouse5, mmb, a-z, 0-9, f1-f12, or a virtual-key code such as 0x10.

# Hold this key to have the selected combat art equipped. Released, the slot is empty.
hold_key = shift

# Hold this key to show the wheel. Point with the mouse, then release to select.
wheel_key = tab

# How fast the mouse steers the wheel. Lower is slower and more precise; try 0.15 to 0.6.
wheel_sensitivity = 0.3

# Art selected when the loaded save has no combat art equipped.
default_art = 5700

# Arts on the wheel, clockwise from the top. Leave empty to show every art the save has.
# 5100 Whirlwind Slash        5200 Nightjar Slash         7000 Nightjar Slash Reversal
# 5300 Ichimonji              7100 Ichimonji: Double      5500 Ashina Cross
# 5600 Floating Passage       7200 Spiral Cloud Passage   5900 Praying Strikes
# 7500 Praying Strikes - Exorcism                         5800 Senpou Leaping Kicks
# 7400 High Monk              6000 Shadowrush             7600 Shadowfall
# 7700 Sakura Dance           5700 Mortal Draw            7300 Empowered Mortal Draw
# 5400 Dragon Flash           6100 One Mind
wheel_arts =

# How much goes into drawn_arts.log: off, error, warn, info, debug or trace.
# debug also logs every key press and slot change, which helps when something doesn't work.
log_level = info
